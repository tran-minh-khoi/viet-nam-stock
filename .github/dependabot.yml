version: 2
# pip is left out on purpose: vnstock lives on vnstocks.com's own index, which
# Dependabot can't reach. Bump requirements.txt by hand (vnstock expires yearly).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
