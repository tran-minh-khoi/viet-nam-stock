services:
  api:
    build: .
    image: viet-nam-stock:local
    container_name: viet-nam-stock
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # PORT in .env is the port on your computer; inside the container the app listens on 8000
      PORT: "8000"
      # Last good data survives restarts (on the stock-data volume)
      SNAPSHOT_FILE: ${SNAPSHOT_FILE:-/data/snapshot.json}
    volumes:
      - stock-data:/data

volumes:
  stock-data:
