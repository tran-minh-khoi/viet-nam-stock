services:
  api:
    build: .
    image: viet-nam-stock:local
    container_name: viet-nam-stock
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Last good data survives restarts (on the vnstock-data volume)
      SNAPSHOT_FILE: ${SNAPSHOT_FILE:-/data/snapshot.json}
    volumes:
      - vnstock-data:/data

volumes:
  vnstock-data:
